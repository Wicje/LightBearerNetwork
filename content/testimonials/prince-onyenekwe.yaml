name: "Prince Onyenekwe"
role: "Member"
quote: "First off, Our Founder Ma'am Tekky is doing really great with the community. And since I joined, I've experienced a shift in my mindset. That I believe is the core of personal growth and development. Once the mind is right, execution follows.\n\nThe way I see myself, my Brand, and Business as a Christian generally has transformed.\n\nThere's been this notion about Christians being poor, not dominating the marketplace, firms, industries and generally wherever they find themselves.\n\nThe Light Bearers Community has shown me that it's a dirty lie.\n\nAs Christians were even more advantaged to rule and dominate spheres of life."
initials: "PO"
color: purple
