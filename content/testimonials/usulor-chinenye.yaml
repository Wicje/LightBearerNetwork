name: "Usulor Chinenye"
role: "Member"
quote: "I can't recall where I heard about Light Bearers Network from but somehow it resonated with me, because in this phase of my life I'm chasing growth with everything in me.\n\nAt the time I joined I was struggling with these;\n1. Not sure what I would do with the course I'm studying.\n2. Inconsistency in my relationship with God; not sure if I wanted to do this Jesus thing for real.\n3. I was finding it hard to pitch my business ideas to friends, mentors and family.\n4. It was difficult to come and speak in a group even when what I have to say is valuable. To pictures of myself was harder.\n\nI can't forget the morning after reading the LBN Weekly Letter and Affirmation, I asked myself \"Vicky what is holding you back?\" I searched deeply and I found things I didn't think or realized was still residing in my soul.\n\nThis finding pushed me closer to the Holy Spirit asking Him to help because I can't afford to not fulfill destiny or live without unlocking every potential in my arsenal.\n\nThat week I put my foot down; started my business; learning those skills I have always wanted to have; graphics design, data analysis, video editing.\n\nI also was able to pitch my hair care product line to my girls every where around me and the demand for these products have not stopped.\n\nReally the Weekly Wednesday Letters are doing a whole lot for me.\n\nThank you Miss Tekky."
initials: "UC"
color: teal
