name: "Henrietta Odinaka"
role: "Team Lead"
quote: "Light Bearers Network has changed certain bad behaviors I used to have. I'm speaking from the office of a Light Bearers Team Lead. My life has been blessed in so many ways through Light Bearers Network.\n\nI used to be an inconsistent team lead who didn't keep to her word, missed important meetings without prior notice, procrastinated, and failed to stick to deadlines. I wasn't taking responsibility.\n\nMy leader, Macaulay Tekevwe, kept correcting and scolding me over and over again. She put me in a different role after identifying my strength even with my inconsistency. With her constant talks and guidance, I became a better person.\n\nToday, I can confidently say that I am consistent. I keep my word. I stick to deadlines. I communicate early and seek permission whenever necessary. I make sure I attend meetings. Above all, I have decided to run with the vision of this organization.\n\nI am deeply grateful to God for giving me the privilege of leading a team in Light Bearers Network. And to Ma Tekky, thank you for not giving up on me."
initials: "HO"
color: orange
