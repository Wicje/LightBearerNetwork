name: "Ugochi Umeugo"
role: "Community Manager"
quote: "Light Bearers Network has made me better from the physical events to the virtual events.\n\nMy highlights are the physical events mostly where people thriving in their careers share their story.\n\nMy highlights from being part of this was The Becoming Conference. Listening to Gutsy Woman and Okosa Lawrence share their stories showed me possibilities.\n\nBeing a member of the planning process and seeing it become a reality made me fulfilled.\n\nI'm also privileged to serve in this institution as I keep growing and that has very much impacted my life."
initials: "UU"
color: green
