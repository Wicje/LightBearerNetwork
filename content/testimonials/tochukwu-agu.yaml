quote: "I am a member of this amazing community, Light Bearers Network.\n\nFirst of all, I want to give a special shout out 💚 to our Leader in Light Bearers Network. Miss Macaulay Tekevwe has always been a great source of Inspiration to me ❤️\n\nIn the LBN community, some of the activities I love so much includes Daily Affirmations, Online Classes which are very impactful e.g \"Financial Intelligence\", \"Building Relationships\", Online prayers amongst others.\n\nIt has been very impactful because it gives me the opportunity to learn everyday and also train my mind on how to be the best version of myself.\n\nGod bless all those who are part of the Light Bearers Network."
